services:
  mysql:
    image: mysql:8.0
    container_name: quantpilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: quantpilot
      MYSQL_DATABASE: quantpilot
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quantpilot-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+asyncmy://root:quantpilot@mysql:3306/quantpilot
      GS_API_KEY: ""
      GS_API_BASE: "https://dgzt.guosen.com.cn/skills"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quantpilot-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
